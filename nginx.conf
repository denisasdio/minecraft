server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Hindari browser memakai versi HTML lama sesudah game diperbarui.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}

